[project]
name = "jmcambios-futuros"
version = "0.1.0"
description = "Agente híbrido de trading para Binance USDⓈ-M Futures (simulación → testnet → real)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
