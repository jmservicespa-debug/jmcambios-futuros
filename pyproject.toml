[project]
name = "jmcambios-futuros"
version = "0.1.0"
description = "Agente híbrido de trading para Binance USDⓈ-M Futures (simulación → testnet → real)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6", "httpx>=0.27", "websockets>=13"]

[project.scripts]
futuros-datos = "futuros.data.cli:main"
futuros-senales = "futuros.strategy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["red: prueba real contra Binance (opcional; activar con FUTUROS_PRUEBA_REAL=1)"]
